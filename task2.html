<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap Form | Web Practice Studio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark site-nav">
    <div class="container">
      <a class="navbar-brand" href="index.html">Leafloop</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="task0.html">Contact</a></li>
          <li class="nav-item"><a class="nav-link" href="task1.html">Form</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="task2.html">B Form</a></li>
          <li class="nav-item"><a class="nav-link" href="task3.html">Live</a></li>
          <li class="nav-item"><a class="nav-link" href="task4.html">Registration</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <header class="page-header">
      <p class="eyebrow">BOOTSTRAP</p>
      <h1>Contact us</h1>
    </header>

    <section class="site-card form-card">
      <form action="#" method="get">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label" for="contact-name">Name</label>
            <input class="form-control" id="contact-name" name="name" type="text" placeholder="Your name" required minlength="2" maxlength="40" pattern="[A-Za-z][A-Za-z ]*">
            <div class="form-text">Use 2–40 characters.</div>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="contact-email">Email</label>
            <input class="form-control" id="contact-email" name="email" type="email" placeholder="name@example.com" required maxlength="100">
            <div class="form-text">We need a valid email address to reply.</div>
          </div>
          <div class="col-12">
            <label class="form-label" for="contact-message">Message</label>
            <textarea class="form-control" id="contact-message" name="message" rows="4" placeholder="Write your message here" required minlength="10" maxlength="300"></textarea>
            <div class="form-text">Write between 10 and 300 characters.</div>
          </div>
          <div class="col-12">
            <button class="site-button" type="submit">Send message</button>
          </div>
        </div>
      </form>
    </section>
  </main>

  <footer class="site-footer">Web Practice Studio · Small steps in web development</footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
