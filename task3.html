<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registration | Leafloop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark site-nav">
    <div class="container">
      <a class="navbar-brand" href="index.html">Leafloop</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="task0.html">Contact</a></li>
          <li class="nav-item"><a class="nav-link" href="task1.html">Form</a></li>
          <li class="nav-item"><a class="nav-link" href="task2.html">B Form</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="task3.html">Live</a></li>
          <li class="nav-item"><a class="nav-link" href="task4.html">Registration</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <header class="page-header">
      <p class="eyebrow">JAVASCRIPT</p>
      <h1>Contact form with live feedback</h1>
    </header>

    <section class="site-card form-card">
      <form id="contact-live-form" class="js-check-form" novalidate>
        <div class="mb-3">
          <label class="form-label" for="live-name">Name</label>
          <input class="form-control" id="live-name" name="name" type="text" required minlength="2" maxlength="40" pattern="[A-Za-z][A-Za-z ]*" data-required-message="Name is required" data-invalid-message="Use 2–40 letters and spaces.">
          <div class="invalid-feedback">Name is required</div>
          <div class="valid-feedback">Looks good!</div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="live-email">Email</label>
          <input class="form-control" id="live-email" name="email" type="email" required maxlength="100" data-required-message="Email is required" data-invalid-message="Please enter a valid email address.">
          <div class="invalid-feedback">Email is required</div>
          <div class="valid-feedback">Looks good!</div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="live-message">Message</label>
          <textarea class="form-control" id="live-message" name="message" rows="4" required minlength="10" maxlength="300" data-required-message="Message is required" data-invalid-message="Write between 10 and 300 characters."></textarea>
          <div class="invalid-feedback">Message is required</div>
          <div class="valid-feedback">Looks good!</div>
        </div>
        <button class="site-button" type="submit">Send message</button>
        <p class="form-success" id="contact-live-form-success" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer class="site-footer">Leafloop · Small steps in web development</footer>
  <script src="js/validation.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
